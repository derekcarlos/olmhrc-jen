name: Update next Sunday's readings

on:
  schedule:
    # Monday 04:17 Asia/Manila = Sunday 20:17 UTC.
    - cron: "17 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-sunday-readings
  cancel-in-progress: false

jobs:
  update:
    name: Prepare and publish Sunday snapshot
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Update from local lectionary
        run: pnpm readings:update
      - name: Validate Sunday snapshot
        run: |
          pnpm readings:validate
          node --test tests/next-sunday-snapshot.test.mjs tests/upcoming-readings.test.mjs
      - name: Commit snapshot and request deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/readings/snapshot.json; then
            echo "Sunday readings are unchanged; no commit or deployment needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/data/readings/snapshot.json
          git commit -m "Update next Sunday's readings"
          git push origin HEAD:main
          # GITHUB_TOKEN pushes do not trigger the Pages push workflow.
          gh workflow run deploy-to-github-pages.yml --ref main
